[project]
name = "caster"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.15.0",
    "depth-anything-3",
    "diffusers>=0.40,<0.41",
    "fastapi>=0.115",
    "google-genai>=2.8.0",
    "huggingface-hub>=0.30",
    "hydra-core>=1.3.7",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "ftfy>=6",
    "hickle>=5",
    "lang-sam @ git+https://github.com/luca-medeiros/lang-segment-anything.git@918043ed4666eea04da88aa179eb8d27ef4b1a1d",
    "matplotlib>=3.10",
    "ninja>=1.13.2",
    "numpy>=1.26,<2",
    "open3d==0.19.0",
    "openai>=1,<3",
    "opencv-python>=4.11,<4.12",
    "modelscope>=1.30",
    "nvidia-cuda-cccl==13.0.85",
    "nvidia-cuda-crt==13.0.88",
    "nvidia-cuda-nvcc==13.0.88",
    "nvidia-nvvm==13.0.88",
    "pillow>=12.3.0",
    "peft>=0.17",
    "pulp>=2.7",
    "pycocotools>=2",
    "python-dotenv>=1",
    "qwen-vl-utils>=0.0.14,<0.1",
    "pyzmq>=27.2.0",
    "PyYAML>=6,<7",
    "pydantic>=2",
    "requests>=2.32",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "sentencepiece>=0.2",
    "supervision>=0.18",
    "termcolor>=3.3.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers>=5,<6",
    "trimesh>=4",
    "uvicorn>=0.30",
    "viser>=1.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["caster", "caster.servers", "caster.llm", "caster.sim_env", "caster.optimization", "caster.optimization.costs", "caster.real"]

[tool.setuptools.package-dir]
caster = "src/caster"

[tool.setuptools.package-data]
caster = ["config/*.yaml", "config/camera/*.yaml", "config/optimization/*.yaml", "config/optimization/cost_function/*.yaml", "config/llm_prompt/*.yaml", "config/servers/*.yaml", "config/video_gen_prompt/*.yaml"]
"caster.sim_env" = ["assets/umi/*.usda", "assets/umi/*.json"]
"caster.real" = ["config/*.yaml"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
depth-anything-3 = { path = "src/depth-anything-3", editable = true }
